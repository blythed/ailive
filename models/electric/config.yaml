parameters:
  - experiment

root: train

options:
  image_size: 160

builds:
  augment_transform:
    getter: sheen.transforms.get_augment_transform
    args:
      image_size: $image_size

  audio_data:
    getter: sheen.data.AudioDataset
    args:
      path: data/audio/base/IPCAA2.dat

  texture_data:
    getter: sheen.data.TextureDataset
    args:
      img_path: data/images/electric
      transform: $augment_transform

  generator:
    getter: sheen.models.Generator
    args:
      network_depth: 5
      channel_number_parameter: 96
      in_channels: 50
      convolution_type: regular
      image_channels: 3

  discriminator:
    getter: sheen.models.Discriminator
    args:
      channel_number_parameter: 96
      network_depth: 5

  train:
    getter: sheen.train.train
    args:
      generator: $generator
      discriminator: $discriminator
      experiment: $experiment
      texture_data: $texture_data
      audio_data: $audio_data
      image_size: $image_size
