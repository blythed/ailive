sensitivity:
  # multiplier
  level: 1.0
  # whether to normalize
  normalize: 0.5

audio:
  # something technical (leave alone)
  device: 7
  # ???
  channels: [1]
  # subsampling???
  downsample: 1
  # visible time slot
  window: 200
  # use pca in inference step
  bPCA: true
  # length of PCA update window
  pca_window: 2000
  # pca smoothing
  n_smooth: 0
