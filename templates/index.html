<html>
  <header>
    <script>
      function changeColor(color) {
        console.log('sending request')
        fetch('http://{{host}}:5001/change-color/' + color)
      }

      function modify(key) {
        console.log('sending request')
        fetch('http://{{host}}:5001/modify/' + key)
      }

      function reset(key) {
        console.log('sending request')
        fetch('http://{{host}}:5001/reset/' + key)
      }

      function pause(key) {
        console.log('sending request')
        fetch('http://{{host}}:5001/pause/' + key)
      }

      function press(key) {
        console.log('sending request')
        fetch('http://{{host}}:5001/press/' + key)
      }

      function setNormalizer() {
        e = document.getElementById('myNorm')
        var value = (e.value / 100)
        console.log('sending request')
        fetch('http://{{host}}:5001/set-normalizer/' + value)
        e = document.getElementById('normDisplay')
        e.innerHTML = 'Normalizer = ' + value
      }

      function setSensitivity() {
        e = document.getElementById('myRange')
        var value = (e.value / 100)
        console.log('sending request')
        fetch('http://{{host}}:5001/set-sensitivity/' + value)
        e = document.getElementById('sDisplay')
        e.innerHTML = 'sensitivity = ' + value
      }

      function smooth() {
        e = document.getElementById('smoothRange')
        console.log('sending request')
        fetch('http://{{host}}:5001/smooth/' + e.value)
        f = document.getElementById('smoothDisplay')
        f.innerHTML = 'Smoothing Window = ' + e.value
      }

      function setPCALength() {
        e = document.getElementById('pcaRange')
        var value = e.value
        console.log('sending request')
        fetch('http://{{host}}:5001/set-pca-length/' + value)
        e = document.getElementById('pca-control')
        e.innerHTML = 'PCA length = ' + value
      }

      function filterImage() {
        e = document.getElementById('fRange')
        var value = (e.value / 10)
        console.log('sending request')
        fetch('http://{{host}}:5001/filter-image/' + value)
        e = document.getElementById('fDisplay')
        e.innerHTML = 'Filter = ' + value
      }

      function setTransitionLength() {
        e = document.getElementById('stepsRange')
        var value = e.value
        console.log('sending request')
        fetch('http://{{host}}:5001/set-transition-len/' + value)
        e = document.getElementById('steps-control')
        e.innerHTML = 'Transition Length = ' + value
      }

      function randomWalk() {
        e = document.getElementById('walkRange')
        var value = (e.value / 100)
        fetch('http://{{host}}:5001/set-walk-speed/' + value)
        e = document.getElementById('wDisplay')
        e.innerHTML = 'Walk speed = ' + value
      }

      function changeModel() {
        e = document.getElementById('select-model')
        var value = (e.value)
        console.log(value)
        fetch('http://{{host}}:5001/change-model/' + value)

      }
    </script>
  </header>
  <body>
    <div style='display: flex;'>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="modify('grey')" >
          More Black/White
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="modify('white')" >
          More Opaque
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="modify('black')" >
          Dim
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="modify('filter')" >
          Blur
      </button>
    </div>
    <div style='display: flex;'>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="reset('grey')" >
          Less Black/White
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="reset('white')" >
          Less Opaque
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="reset('black')" >
          Lighten
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="reset('filter')" >
          Sharpen
      </button>
    </div>
    <div style='display: flex;'>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="pause('grey')" >
          Freeze Black/White
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="pause('white')" >
          Freeze Opacity
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="pause('black')" >
          Keep dim/lightness
      </button>
      <button
        style='width: 25%; height: 25%; font-size: 30px;'
        onclick="pause('filter')" >
          Keep blurriness/ sharpness
      </button>
    </div>
    <div>
      <div
        id='steps-control'
        style='text-align: center; width: 100%; padding-top: 20px; font-family: arial; font-size: 30px;' >
            Transition Length = 100
      </div>
      <input
        onChange='setTransitionLength()'
        style='width: 100%;'
        type="range"
        min="1" max="100"
        value="100"
        steps="1"
        class="slider"
        id="stepsRange" >
    </div>
    <div>
      <div
        id='sDisplay'
        style='text-align: center; width: 100%; padding-top: 20px; font-family: arial; font-size: 30px;' >
            Sensitivity = 1
      </div>
      <input
        onChange='setSensitivity()'
        style='width: 100%;'
        type="range"
        min="0" max="600"
        value="100"
        steps="1"
        class="slider"
        id="myRange" >
    </div>
    <div>
      <div
        id='normDisplay'
        style='text-align: center; width: 100%; padding-top: 20px; font-family: arial; font-size: 30px;' >
            Normalizer = 0
      </div>
      <input
        onChange='setNormalizer()'
        style='width: 100%;'
        type="range"
        min="0" max="100"
        value="0"
        steps="1"
        class="slider"
        id="myNorm" >
    </div>
    <div>
      <div
        id='wDisplay'
        style='text-align: center; width: 100%; padding-top: 20px; font-family: arial; font-size: 30px;' >
            Walk speed = 0
      </div>
      <input
        onChange='randomWalk()'
        style='width: 100%;'
        type="range"
        min="0" max="100"
        value="0"
        steps="1"
        class="slider"
        id="walkRange" >
    </div>
    <div>
      <div
        id='smoothDisplay'
        style='text-align: center; width: 100%; padding-top: 20px; font-family: arial; font-size: 30px;' >
            Smoothing window = 1
      </div>
      <input
        onChange='smooth()'
        style='width: 100%;'
        type="range"
        min=1 max="4"
        value="1"
        steps="1"
        class="slider"
        id="smoothRange" >
    </div>
  </div>
    <div>
      <div>SELECT MODEL</div>
      <select onchange="changeModel()" id="select-model">
        {% for model in model_names %}
          <option value="{{model}}">{{model}}</option>
        {% endfor %}
      </select>
    </div>
  </body>
</html>
